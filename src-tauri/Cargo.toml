[package]
name = "clip-translator"
version = "0.2.0"
description = "A cross-platform clipboard-first desktop translator"
authors = ["ClipLingo contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clip_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
arboard = "3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
html-escape = "0.2"
on-selected-text = "0.1.6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
rapidocr-core = { version = "0.3.1", default-features = false, features = ["download-binaries"] }
imageproc = { version = "0.25.1", default-features = false }
ab_glyph = "0.2.32"
oximedia-restoration = "0.2.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "block2"] }
block2 = "0.6"
macos-accessibility-client = "0.0.1"

[patch.crates-io]
on-selected-text = { path = "vendor/on-selected-text" }
